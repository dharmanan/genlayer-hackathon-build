<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenLayer Prediction Market</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .market-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.07);
            padding: 24px;
            margin-bottom: 20px;
        }
        .market-card h2 {
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .pools {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            text-align: center;
        }
        .pool {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            flex-basis: 30%;
        }
        .pool span {
            display: block;
            font-size: 0.9em;
            color: #777;
        }
        .pool strong {
            font-size: 1.4em;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #resolve-market-btn {
            background-color: #28a745;
        }
        #resolve-market-btn:hover {
            background-color: #218838;
        }
        #logs {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            height: 150px;
            overflow-y: scroll;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GenLayer Prediction Market</h1>

        <div class="market-card">
            <h2>Event 441613: Arsenal vs Chelsea</h2>
            <p>Place your bets on the outcome. The market will be resolved by the Intelligent Contract after the match finishes.</p>
            <div class="pools">
                <div class="pool">
                    <span id="pool-home-label">Home (Arsenal)</span>
                    <strong id="pool-home-amount">0</strong>
                </div>
                <div class="pool">
                    <span id="pool-away-label">Away (Chelsea)</span>
                    <strong id="pool-away-amount">0</strong>
                </div>
                <div class="pool">
                    <span id="pool-draw-label">Draw</span>
                    <strong id="pool-draw-amount">0</strong>
                </div>
            </div>

            <div class="form-group">
                <label for="user-address">Your Address (Simulated)</label>
                <input type="text" id="user-address" placeholder="e.g., 'Alice'">
            </div>
            <div class="form-group">
                <label for="team-choice">Your Choice</label>
                <select id="team-choice">
                    <option value="home">Home (Arsenal)</option>
                    <option value="away">Away (Chelsea)</option>
                    <option value="draw">Draw</option>
                </select>
            </div>
            <div class="form-group">
                <label for="bet-amount">Amount</label>
                <input type="number" id="bet-amount" placeholder="100">
            </div>
            <button id="place-bet-btn">Place Bet</button>
        </div>

        <div class="market-card">
            <h2>Market Resolution</h2>
            <button id="resolve-market-btn">Resolve Market</button>
        </div>

        <div id="logs"></div>
    </div>

    <script>
        // Wait for the document to be fully loaded
        document.addEventListener("DOMContentLoaded", () => {
            
            // Get all interactive elements
            const placeBetBtn = document.getElementById("place-bet-btn");
            const resolveMarketBtn = document.getElementById("resolve-market-btn");
            const logs = document.getElementById("logs");

            // Pool amounts
            const poolHomeEl = document.getElementById("pool-home-amount");
            const poolAwayEl = document.getElementById("pool-away-amount");
            const poolDrawEl = document.getElementById("pool-draw-amount");

            // Input fields
            const userAddressEl = document.getElementById("user-address");
            const teamChoiceEl = document.getElementById("team-choice");
            const betAmountEl = document.getElementById("bet-amount");

            // Application state
            let poolHome = 0;
            let poolAway = 0;
            let poolDraw = 0;
            let isResolved = false;

            // Log helper function
            function log(message) {
                console.log(message);
                logs.innerHTML += `> ${message}<br>`;
                logs.scrollTop = logs.scrollHeight; // Auto-scroll to bottom
            }

            // --- Place Bet Button Logic ---
            placeBetBtn.addEventListener("click", () => {
                if (isResolved) {
                    log("Error: Market is already resolved.");
                    return;
                }

                const user = userAddressEl.value || "Anonymous";
                const team = teamChoiceEl.value;
                const amount = parseInt(betAmountEl.value) || 0;

                if (amount <= 0) {
                    log("Error: Please enter a valid amount.");
                    return;
                }

                log(`Simulating: ${user} bets ${amount} on '${team}'...`);

                // === THIS IS THE SIMULATION PART ===
                // TODO: Replace this with the GenLayer JS SDK call
                // e.g., await genLayer.contract.call('place_bet', user, team, amount);
                
                // Simulate updating the pools
                if (team === 'home') {
                    poolHome += amount;
                    poolHomeEl.innerText = poolHome;
                } else if (team === 'away') {
                    poolAway += amount;
                    poolAwayEl.innerText = poolAway;
                } else if (team === 'draw') {
                    poolDraw += amount;
                    poolDrawEl.innerText = poolDraw;
                }

                log(`Success: Bet placed. Total Pot: ${poolHome + poolAway + poolDraw}`);
                
                // Clear inputs
                userAddressEl.value = "";
                betAmountEl.value = "";
            });

            // --- Resolve Market Button Logic ---
            resolveMarketBtn.addEventListener("click", () => {
                if (isResolved) {
                    log("Error: Market has already been resolved.");
                    return;
                }

                log("Resolving market...");
                log("Simulating: Calling 'resolve_market()' function on contract...");
                log("Simulating: Contract is now calling TheSportsDB API...");

                // Disable buttons to show work is being done
                placeBetBtn.disabled = true;
                resolveMarketBtn.disabled = true;

                // === THIS IS THE SIMULATION PART ===
                // TODO: Replace this with the GenLayer JS SDK call
                // e.g., await genLayer.contract.call('resolve_market');

                // We use a 3-second timeout to simulate the API call and blockchain confirmation
                setTimeout(() => {
                    log("...API call successful. Match finished.");
                    log("...Score: 2 (Home) - 2 (Away)");
                    log("...Winner determined: 'draw'");
                    log("...Processing payouts...");
                    
                    // Simulate the payout logic from our test case
                    // Total Pot = 200 (if Alice=100 home, Bob=50 away, Charlie=50 draw)
                    // We'll just hardcode the test case from our README
                    // (Assuming bets: 100 home, 50 away, 50 draw)
                    const totalPot = poolHome + poolAway + poolDraw;
                    const winnerPot = poolDraw;
                    
                    if (winnerPot > 0) {
                        // Simulating Charlie (bet 20) and David (bet 30)
                        // This part is hard to simulate perfectly without the real bet data,
                        // so we just show the principle:
                        log("PAYOUT PROCESSED (Simulation): Winners on 'draw' are paid.");
                        log(`PAYOUT: User 'Charlie' (bet 20) receives ${(20/50) * totalPot} tokens.`);
                        log(`PAYOUT: User 'David' (bet 30) receives ${(30/50) * totalPot} tokens.`);
                    } else {
                        log("No bets were placed on 'draw'.");
                    }

                    log("Market is now resolved and closed.");
                    isResolved = true;
                }, 3000); // 3-second delay
            });

            log("Frontend initialized. Ready to place bets.");
        });
    </script>
</body>
</html>
